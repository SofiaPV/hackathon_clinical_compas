{% extends "base.html" %}
{% block title %}Вход — Медмонитор{% endblock %}
{% block body %}
<body class="auth-page plain">
  <main class="auth-card">
    <h1>С возвращением</h1>
    <p class="lead muted">Войдите, чтобы продолжить работу с Медмонитором</p>
    <form class="auth-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Почта</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="auth-actions">
        <a class="btn-link" href="{{ url_for('register') }}">Зарегистрироваться</a>
        <button class="btn btn-primary btn-pill" type="submit">Войти</button>
      </div>
    </form>
    <p class="faint center" style="margin-top:20px">Не используйте реальные медицинские данные в тестовой версии.</p>
  </main>
</body>
{% endblock %}
