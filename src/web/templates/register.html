{% extends "base.html" %}
{% block title %}Регистрация — Медмонитор{% endblock %}
{% block body_class %}auth-page tinted{% endblock %}
{% block body %}
  <main class="auth-card">
    <h1>Создать аккаунт</h1>
    <p class="lead muted">Зарегистрируйтесь для работы с Медмонитором</p>
    <form class="auth-form" method="post" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Почта</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input class="input" type="password" id="password" name="password" placeholder="Минимум 8 символов" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="lastname">Фамилия</label>
        <input class="input" type="text" id="lastname" name="lastname" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="firstname">Имя</label>
        <input class="input" type="text" id="firstname" name="firstname" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="patronymic">Отчество</label>
        <input class="input" type="text" id="patronymic" name="patronymic" autocomplete="additional-name">
      </div>
      <label class="checkbox-field" for="is_doctor">
        <input type="checkbox" id="is_doctor" name="is_doctor">
        <span>Я врач</span>
      </label>
      <div class="auth-actions">
        <a class="btn-link" href="{{ url_for('login') }}">Уже есть аккаунт</a>
        <button class="btn btn-primary btn-pill" type="submit">Зарегистрироваться</button>
      </div>
    </form>
  </main>
{% endblock %}
